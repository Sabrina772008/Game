<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#240046" />
    <title>Friend Arcade</title>
    <link rel="icon" href="public/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="public/css/style.css" />
    <!-- The game files live in public/, server/games/ and shared/. "/shared/..." imports point at this folder. -->
    <script type="importmap">{ "imports": { "/shared/": "./shared/" } }</script>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  </head>
  <body>
    <header id="topbar" class="hidden">
      <div class="brand">🕹️ Friend Arcade</div>
      <div class="me-chip">
        <span id="me-avatar"></span>
        <span id="me-name"></span>
        <span id="time-left" class="time-left" title="Play time left today"></span>
        <span class="coins" title="Coins are earned by playing. They have no real-money value."><span class="coin">●</span> <b id="me-coins">0</b></span>
        <button id="btn-signout" class="ghost small">Sign out</button>
      </div>
    </header>

    <main>
      <!-- Sign in / sign up -->
      <section id="screen-auth" class="screen hidden">
        <div class="card auth-card">
          <h1 class="logo">Friend<br />Arcade</h1>
          <p class="sub">Private rooms. Three games. Your friends.</p>
          <div class="tabs">
            <button class="tab active" data-mode="login">Sign in</button>
            <button class="tab" data-mode="signup">Create account</button>
          </div>
          <form id="auth-form">
            <label>Username <input name="username" autocomplete="username" required minlength="3" maxlength="16" pattern="[A-Za-z0-9_]+" /></label>
            <label>Password <input name="password" type="password" autocomplete="current-password" required minlength="6" /></label>
            <button type="submit" class="primary big" id="auth-submit">Sign in</button>
            <p class="error" id="auth-error"></p>
          </form>
        </div>
      </section>

      <!-- Home -->
      <section id="screen-home" class="screen hidden">
        <div class="home-grid">
          <div class="card">
            <h2>Play with friends</h2>
            <button id="btn-create" class="primary big">Create a private room</button>
            <div class="or">or join with a code</div>
            <form id="join-form" class="row">
              <input id="join-code" placeholder="ROOM CODE" maxlength="5" autocomplete="off" />
              <button type="submit" class="secondary">Join</button>
            </form>
          </div>
          <div class="card">
            <h2>Your look</h2>
            <div id="home-avatar" class="home-avatar"></div>
            <button id="btn-avatar" class="secondary">Edit avatar &amp; shop</button>
          </div>
          <div class="card wide">
            <h2>Your stats</h2>
            <div id="stats"></div>
          </div>
        </div>
      </section>

      <!-- Avatar editor & shop -->
      <section id="screen-avatar" class="screen hidden">
        <div class="card editor">
          <div class="editor-preview">
            <canvas id="editor-canvas" width="260" height="260"></canvas>
            <div class="editor-actions">
              <button id="btn-avatar-save" class="primary">Save look</button>
              <button id="btn-avatar-back" class="ghost">Back</button>
            </div>
            <p class="hint">Coins are earned by playing matches. They can't be bought and have no real-money value.</p>
          </div>
          <div class="editor-items">
            <div class="tabs" id="cat-tabs"></div>
            <div id="item-grid" class="item-grid"></div>
          </div>
        </div>
      </section>

      <!-- Lobby -->
      <section id="screen-lobby" class="screen hidden">
        <div class="lobby">
          <div class="card lobby-head">
            <div>
              <div class="label">Room code</div>
              <div class="room-code" id="room-code">-----</div>
            </div>
            <div class="invite">
              <button id="btn-copy-link" class="secondary">Copy invite link</button>
              <button id="btn-leave-room" class="ghost">Leave room</button>
            </div>
          </div>
          <div class="card">
            <h2>Players <span id="player-count"></span></h2>
            <div id="member-list" class="member-list"></div>
          </div>
          <div class="card">
            <h2>Game <span class="muted" id="host-note"></span></h2>
            <div id="game-picker" class="game-picker"></div>
            <div id="team-panel" class="team-panel hidden"></div>
            <div class="lobby-buttons">
              <button id="btn-ready" class="primary big">I'm ready!</button>
              <button id="btn-start" class="primary big hidden">Start game</button>
            </div>
            <p class="muted" id="lobby-status"></p>
          </div>
        </div>
      </section>

      <!-- Game -->
      <section id="screen-game" class="screen hidden">
        <canvas id="game-canvas"></canvas>
        <div id="hud"></div>
        <div id="touch" class="touch hidden"></div>
        <button id="btn-help" class="help-btn" title="Help (H)">?</button>
        <div id="help" class="help hidden"></div>
      </section>

      <!-- Results -->
      <section id="screen-results" class="screen hidden">
        <div class="card results">
          <div class="muted" id="results-game"></div>
          <h1 id="results-headline"></h1>
          <div id="results-teams" class="results-teams"></div>
          <ol id="results-list" class="results-list"></ol>
          <p class="muted" id="results-note"></p>
          <button id="btn-to-lobby" class="primary big">Back to lobby</button>
        </div>
      </section>
    </main>

    <!-- Voice / video call dock. Lives outside the screens so it stays connected. -->
    <aside id="call" class="call hidden">
      <div id="call-tiles" class="call-tiles"></div>
      <div class="call-controls">
        <button id="btn-call-join" class="secondary small">📞 Join call</button>
        <button id="btn-mic" class="small hidden" title="Microphone">🎤 Mic off</button>
        <button id="btn-cam" class="small hidden" title="Camera">📷 Cam off</button>
        <button id="btn-deafen" class="small hidden" title="Mute everyone else on your side">🔊 Sound on</button>
        <button id="btn-call-leave" class="danger small hidden">Leave call</button>
        <button id="btn-call-min" class="ghost small" title="Hide / show video">▾</button>
      </div>
    </aside>

    <div id="toasts"></div>
    <div id="conn" class="conn hidden">Reconnecting…</div>

    <script type="module" src="public/js/app.js"></script>
  </body>
</html>
